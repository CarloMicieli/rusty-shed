[package]
name = "rusty-shed"
version = "0.1.0"
description = "The ultimate companion app for scale modelers and collectors"
authors = ["Carlo Micieli <piovarolo@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_shed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build            = { version = "2.5.3", features = [] }

[dependencies]
anyhow                 = "1.0.100"
async-trait            = "0.1.89"
chrono                 = { version = "0.4.43", features = ["serde"] }
csv                    = "1.4.0"
flexi_logger           = "0.31.8"
isocountry             = "0.3.2"
itertools              = "0.14"
log                    = "0.4.29"
once_cell              = "1.21.3"
regex                  = "1.12.2"
rust_decimal           = { version = "1.40.0", features = ["serde-with-float"] }
rust_decimal_macros    = "1.40.0"
serde                  = { version = "1.0.228", features = ["derive"] }
serde_json             = "1.0.149"
slug                   = "0.1.6"
specta                 = { version = "2.0.0-rc.22", features = ["derive", "chrono", "rust_decimal", "uuid", "url"] }
specta-typescript      = "0.0.9"
sqlx                   = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "uuid", "rust_decimal"] }
strum                  = "0.27.2"
strum_macros           = "0.27.2"
tauri                  = { version = "2.9.5", features = [] }
tauri-plugin-fs        = "2.4.5"
tauri-plugin-http      = "2.5.6"
tauri-plugin-log       = "2.8.0"
tauri-plugin-opener    = "2.5.3"
tauri-specta           = { version = "2.0.0-rc.21", features = ["typescript"] }
thiserror              = "2.0.17"
tokio                  = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
url                    = { version = "2.5.8", features = ["serde"] }
uuid                   = { version = "1.19.0", features = ["v4", "serde", "fast-rng"] }


[dev-dependencies]
rand                   = "0.9.2"
pretty_assertions      = "1.4.1"
rstest                 = "0.26.1"
serde_derive           = "1.0.228"
mockall                = "0.14.0"
