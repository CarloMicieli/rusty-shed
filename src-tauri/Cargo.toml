[package]
name = "rusty-shed"
version = "0.1.0"
description = "The ultimate companion app for scale modelers and collectors"
authors = ["Carlo Micieli <piovarolo@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_shed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build             = { version = "2.5.6", features = [] }

[dependencies]
anyhow                  = "1.0.102"
async-trait             = "0.1.89"
chrono                  = { version = "0.4.44", features = ["serde"] }
csv                     = "1.4.0"
flate2                  = "1.1"
flexi_logger            = "0.31.8"
garde                   = { version = "0.22.1", features = ["derive", "regex"] }
google-drive3           = "7.0"
image                   = "0.25"
infer                   = "0.16"
isocountry              = "0.3.2"
itertools               = "0.14"
jsonschema              = { version = "0.29", default-features = false }
log                     = "0.4.29"
oauth2                  = { version = "5", features = ["reqwest"] }
once_cell               = "1.21.4"
online                  = { version = "4.0.2", default-features = false, features = ["tokio", "tokio-runtime"] }
regex                   = "1.12.3"
reqwest                 = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal            = { version = "1.40.0", features = ["serde-with-float"] }
rust_decimal_macros     = "1.40.0"
secrecy                 = { version = "0.10", features = ["serde"] }
serde                   = { version = "1.0.228", features = ["derive"] }
serde_json              = "1.0.149"
slug                    = "0.1.6"
specta                  = { version = "2.0.0-rc.22", features = ["derive", "chrono", "rust_decimal", "uuid", "url"] }
specta-typescript       = "0.0.9"
sqlx                    = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "uuid", "rust_decimal"] }
strum                   = "0.27.2"
strum_macros            = "0.27.2"
tar                     = "0.4"
tauri                   = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-deep-link  = "2"
tauri-plugin-global-shortcut    = "2"
tauri-plugin-dialog     = "2"
tauri-plugin-fs         = "2.4.5"
tauri-plugin-http       = "2.5.7"
tauri-plugin-log        = "2.8.0"
tauri-plugin-mcp-bridge = "0.8.3"
tauri-plugin-oauth      = "2"
tauri-plugin-opener     = "2.5.3"
tauri-plugin-os         = "2"
tauri-plugin-store      = "2"
tauri-plugin-stronghold = "2"
tauri-plugin-window-state = "2"
tauri-specta            = { version = "2.0.0-rc.21", features = ["typescript"] }
thiserror               = "2.0.18"
tokio                   = { version = "1.50.0", features = ["rt-multi-thread", "macros", "fs"] }
url                     = { version = "2.5.8", features = ["serde"] }
urlencoding             = "2.1.3"
uuid                    = { version = "1.22.0", features = ["v4", "serde", "fast-rng"] }
zeroize                 = "1"
zip                     = "0.6"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring                = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
fake                   = { version = "4", features = ["derive"] }
mockall                = "0.14.0"
pretty_assertions      = "1.4.1"
rand                   = "0.9.2"
rstest                 = "0.26.1"
serde_derive           = "1.0.228"
serial_test            = "3.4.0"
tempfile               = "3.27.0"

[profile.dev.package.scrypt]
opt-level = 3
