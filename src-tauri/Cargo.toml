[package]
name = "rusty-shed"
version = "0.2.0"
description = "The ultimate companion app for scale modelers and collectors"
authors = ["Carlo Micieli <piovarolo@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95.0"
default-run = "rusty-shed"

[[bin]]
name = "gen_types"
path = "src/bin/gen_types.rs"

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rusty_shed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build                  = { version = "2.6.0", features = [] }

[dependencies]
anyhow                       = "1.0.102"
async-trait                  = "0.1.89"
chrono                       = { version = "0.4.44", features = ["serde"] }
csv                          = "1.4.0"
flate2                       = "1.1.9"
garde                        = { version = "0.22.1", features = ["derive", "regex"] }
google-drive3                = "7.0"
image                        = "0.25.10"
infer                        = "0.19.0"
isocountry                   = "0.3.2"
itertools                    = "0.14.0"
jsonschema                   = { version = "0.45.1", default-features = false }
libc                         = "0.2"
oauth2                       = { version = "5", features = ["reqwest"] }
once_cell                    = "1.21.4"
parking_lot                  = "0.12.5"
online                       = { version = "4.0.2", default-features = false, features = ["tokio", "tokio-runtime"] }
regex                        = "1.12.3"
reqwest                      = { version = "0.13.3", default-features = false, features = ["json", "rustls", "query", "form"] }
rust_decimal                 = { version = "1.41.0", features = ["serde-with-float"] }
rust_decimal_macros          = "1.40.0"
secrecy                      = { version = "0.10", features = ["serde"] }
serde                        = { version = "1.0.228", features = ["derive"] }
serde_json                   = "1.0.149"
sha2                         = "0.11.0"
slug                         = "0.1.6"
specta                       = { version = "=2.0.0-rc.24", features = ["derive", "chrono", "rust_decimal", "uuid", "url"] }
specta-typescript            = "=0.0.11"
sqlx                         = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros", "chrono", "uuid", "rust_decimal"] }
strum                        = "0.28.0"
strum_macros                 = "0.28.0"
tar                          = "0.4.45"
tauri                        = { version = "2.11.0", features = ["protocol-asset", "image-png"] }
tauri-plugin-deep-link       = "2.4.9"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-dialog          = "2.7.1"
tauri-plugin-fs              = "2.5.1"
tauri-plugin-http            = "2.5.9"
tauri-plugin-log             = "2.8.0"
tauri-plugin-mcp-bridge      = "0.10.0"
tauri-plugin-oauth           = "2.0.0"
tauri-plugin-opener          = "2.5.4"
tauri-plugin-os              = "2.3.2"
tauri-plugin-store           = "2.4.3"
tauri-plugin-stronghold      = "2.3.1"
tauri-plugin-window-state    = "2.4.1"
tauri-specta                 = { version = "2.0.0-rc.24", features = ["typescript"] }
thiserror                    = "2.0.18"
tokio                        = { version = "1.52.1", features = ["rt-multi-thread", "macros", "fs"] }
tracing                      = { version = "0.1.44", features = ["log"] }
tracing-subscriber           = { version = "0.3.23", features = ["env-filter", "fmt"] }
url                          = { version = "2.5.8", features = ["serde"] }
urlencoding                  = "2.1.3"
tempfile                     = "3.27.0"
uuid                         = { version = "1.23.1", features = ["v4", "serde", "fast-rng"] }
zeroize                      = "1.8.2"
zip                          = "8.6.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring                      = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[dev-dependencies]
fake                         = { version = "5.1.0", features = ["derive"] }
mockall                      = "0.14.0"
pretty_assertions            = "1.4.1"
rand                         = "0.10.1"
rstest                       = "0.26.1"
serde_derive                 = "1.0.228"
serial_test                  = "3.4.0"

[profile.dev.package.scrypt]
opt-level = 3
