<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    %sveltekit.head%

    <style>
      /* Keep the loading screen styles here so they render 
         immediately before the main CSS/JS bundles arrive */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #1a1a1a;
        color: #e5e5e5;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        z-index: 9999;
      }
      #app-loading .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #3b82f6; /* Consider changing to a brassy color! */
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #app-loading .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      #app-loading .text {
        font-size: 0.875rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body data-sveltekit-preload-data="hover" data-theme="steampunk-dark">
    <div id="app-loading">
      <div class="content">
        <div class="spinner"></div>
        <div class="text">Loading rusty-shed...</div>
      </div>
    </div>

    <div style="display: contents">%sveltekit.body%</div>

    <script>
      // Fallback: SvelteKit 2/Svelte 5 does not fire 'sveltekit:start', using 'load' instead
      window.addEventListener('load', function () {
        const loader = document.getElementById('app-loading');
        if (loader) {
          loader.style.transition = 'opacity 0.3s ease-out';
          loader.style.opacity = '0';
          setTimeout(function () {
            loader.remove();
          }, 100);
        }
      });
    </script>
  </body>
</html>
