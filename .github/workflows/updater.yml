name: Weekly Dependency Update

on:
  schedule:
    # Runs at 00:00 every Sunday (Saturday night)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🟢 Update Deno dependencies
        run: |
          # Automatically checks for updates and rewrites out-of-date
          # npm: or jsr: specs directly in your deno.json and updates deno.lock
          deno outdated --update

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 🦀 Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: 🦀 Upgrade dependencies
        run: cargo upgrade --pinned # Updates Cargo.toml
        working-directory: src-tauri

      - name: 🦀 Update Cargo.lock
        run: cargo update # Ensures lockfile matches new TOML
        working-directory: src-tauri

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: weekly deno and cargo update'
          title: 'chore: weekly deno and cargo update'
          body: |
            Automated weekly dependency updates for Tauri 2 + Deno project.
            - Updated `Cargo.lock`
            - Updated `deno.lock`
          branch: automated-dep-update
          delete-branch: true
