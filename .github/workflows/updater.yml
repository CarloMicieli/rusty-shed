name: Weekly Dependency Update

on:
  schedule:
    # Runs at 00:00 every Sunday (Saturday night)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: 📦 Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 🟢 Update Bun dependencies
        run: |
          # bun update refreshes bun.lock
          # Use 'bun update --latest' if you want to ignore ranges in package.json
          bun update

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: 🦀 Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: 🦀 Upgrade dependencies
        run: cargo upgrade --pinned --recursive=false # Updates Cargo.toml only
        working-directory: src-tauri

      - name: 🦀 Update Cargo.lock
        run: cargo update # Ensures lockfile matches new TOML
        working-directory: src-tauri

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: weekly bun and cargo update'
          title: 'chore: weekly bun and cargo update'
          body: |
            Automated weekly dependency updates for Tauri 2 project.
            - Updated `Cargo.lock`
            - Updated `bun.lock`
          branch: automated-dep-update
          delete-branch: true
