name: Weekly Dependency Update

on:
  schedule:
    # Runs at 00:00 every Sunday (Saturday night)
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 🟢 Update Node.js dependencies
        run: |
          # pnpm update will refresh the pnpm-lock.yaml
          # Use 'pnpm update --latest' if you want to ignore ranges in package.json
          pnpm update

      - name: 🦀 Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0

      - name: 🦀 Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: 🦀 Upgrade dependencies
        run: cargo upgrade --pinned --recursive=false # Updates Cargo.toml only
        working-directory: src-tauri

      - name: 🦀 Update Cargo.lock
        run: cargo update # Ensures lockfile matches new TOML
        working-directory: src-tauri

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: weekly pnpm and cargo update'
          title: 'chore: weekly pnpm and cargo update'
          body: |
            Automated weekly dependency updates for Tauri 2 project.
            - Updated `Cargo.lock`
            - Updated `pnpm-lock.yaml`
          branch: automated-dep-update
          delete-branch: true
