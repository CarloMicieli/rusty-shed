name: Release Linux

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 📦 Install frontend dependencies
        run: deno install

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 🔖 Sync version from tag to tauri.conf.json
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          # Strip leading 'v' (e.g. v1.2.3 → 1.2.3)
          APP_VERSION="${TAG_VERSION#v}"
          jq --arg v "$APP_VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          echo "Version set to ${APP_VERSION}"

      - name: 🎭 Run frontend build
        run: deno task build

      - name: 🏗️ Build Tauri app and create GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseName: 'rusty-shed ${{ github.ref_name }}'
          tagName: ${{ github.ref_name }}
          prerelease: false
          includeUpdaterJson: false
          args: --target x86_64-unknown-linux-gnu