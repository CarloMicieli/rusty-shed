name: Release Linux

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.2.3 or v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 📦 Install frontend dependencies
        run: deno install

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: ⚡ Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 🔖 Determine and Sync Version
        id: version_handler # 🟢 Added ID to reference outputs downstream
        run: |
          # 1. Fallback logic: check input text first, then git reference tag name
          RAW_VERSION="${{ inputs.version || github.ref_name }}"
          
          # 2. Strip leading 'v' safely regardless of where the string came from
          APP_VERSION="${RAW_VERSION#v}"
          TAG_VERSION="v${APP_VERSION}"
          
          # 3. Set structural step outputs for the GitHub Actions context layer
          echo "tag_name=${TAG_VERSION}" >> $GITHUB_OUTPUT
          
          # 4. Write directly into tauri.conf.json
          jq --arg v "$APP_VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          echo "Version successfully set to ${APP_VERSION} (Tag: ${TAG_VERSION})"

      - name: 🎭 Run frontend build
        run: deno task build

      - name: 🏗️ Build Tauri app and create GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 🟢 Securely pull directly from our step output graph context
          releaseName: 'rusty-shed ${{ steps.version_handler.outputs.tag_name }}'
          tagName: ${{ steps.version_handler.outputs.tag_name }}
          prerelease: false
          includeUpdaterJson: false
          args: --target x86_64-unknown-linux-gnu