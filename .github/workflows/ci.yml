name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'deno.json'
      - 'src-tauri/**'
      - 'src-tauri/Cargo.toml'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'deno.json'
      - 'src-tauri/**'
      - 'src-tauri/Cargo.toml'
      - 'src/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 📦 Install frontend dependencies
        run: deno install

      - name: 🎨 Check Formatting (Deno Format)
        run: deno task format --check

      - name: 🧹 Linting (Deno Lint)
        run: deno task lint

      - name: 🧪 Type Check (Svelte Check / TypeScript)
        run: deno task svelte-check

      - name: 🎭 Run frontend build
        run: deno task build

      - name: 🔬 Run frontend tests
        run: deno task test

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: ⚡ Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Run Specta Generation
        run: cargo run --bin gen_types
        working-directory: src-tauri

      - name: Verify Bindings are up-to-date
        run: |
          if [ -n "$(git status --porcelain src/lib/bindings.ts)" ]; then
            echo "::error::TypeScript bindings are out of sync! Please run 'deno task specta:generate' locally and commit the changes."
            git diff src/lib/bindings.ts
            exit 1
          fi

      - name: 🦀 Run rustfmt
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: 🦀 Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: 🦀 Run cargo tests
        run: cargo test --workspace --no-fail-fast
        working-directory: src-tauri