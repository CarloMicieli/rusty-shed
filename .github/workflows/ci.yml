name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v5

      - name: 🛠️ Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      # 1. Install PNPM first without specific versioning constraints
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4

      # 2. Setup Node and let it find the pnpm store automatically
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4 # v4 is current stable
        with:
          node-version: '22' # Svelte 5/Tauri 2 works best on 20 or 22 (LTS)
          cache: 'pnpm'

      - name: 📦 Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Check Formatting (Prettier)
        run: pnpm format:check

      - name: 🧹 Linting (ESLint)
        run: pnpm lint

      - name: 🧪 Type Check (TypeScript)
        run: pnpm check

      - name: 🎭 Run frontend build
        run: pnpm build

      - name: 🔬 Run frontend tests
        run: pnpm test

      # 3. Modern Rust Setup (The actions-rs organization is unmaintained)
      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # 4. Superior caching for Rust
      - name: ⚡ Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 🦀 Run rustfmt
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: 🦀 Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri

      - name: 🦀 Run cargo tests
        run: cargo test --workspace --no-fail-fast
        working-directory: src-tauri
