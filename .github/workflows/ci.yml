name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'src-tauri/**'
      - 'src-tauri/Cargo.toml'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'src-tauri/**'
      - 'src-tauri/Cargo.toml'
      - 'src/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  CARGO_BUILD_WARNINGS: deny

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: 📦 Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Check Formatting (Prettier)
        run: pnpm format:check

      - name: 🧹 Linting (ESLint)
        run: pnpm lint

      - name: 🧪 Type Check (TypeScript)
        run: pnpm check

      - name: 🎭 Run frontend build
        run: pnpm build

      - name: 🔬 Run frontend tests
        run: pnpm test

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt

      - name: ⚡ Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Run Specta Generation
        run: cargo run --bin gen_types
        working-directory: src-tauri

      - name: Verify Bindings are up-to-date
        run: |
          if [ -n "$(git status --porcelain src/lib/bindings.ts)" ]; then
            echo "::error::TypeScript bindings are out of sync! Please run 'pnpm specta:generate' locally and commit the changes."
            git diff src/lib/bindings.ts
            exit 1
          fi

      - name: 🦀 Run rustfmt
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: 🦀 Run Clippy
        run: cargo clippy --all-targets --all-features --keep-going
        working-directory: src-tauri

      - name: 🦀 Run cargo tests
        run: cargo test --workspace --no-fail-fast
        working-directory: src-tauri
