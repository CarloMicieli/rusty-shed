name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'src-tauri/**'
      - 'src-tauri/Cargo.toml'
      - 'src/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - 'package.json'
      - 'src-tauri/**'
      - 'src-tauri/Cargo.toml'
      - 'src/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: true
  CARGO_BUILD_WARNINGS: deny

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📂 Checkout
        uses: actions/checkout@v6

      - name: 🛠️ Install system packages (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: 📦 Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🎨 Check Formatting (Prettier)
        run: bun run format:check

      - name: 🧹 Linting (Oxlint & ESLint)
        run: |
          bun run lint:fast
          svelte-kit sync && eslint .

      - name: 🧪 Type Check (TypeScript, heavy)
        run: bun run check

      - name: 🎭 Run frontend build
        run: bun run build

      - name: 🔬 Run frontend tests
        run: bun run test

      - name: 🦀 Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: ⚡ Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Run Specta Generation
        run: cargo run --bin gen_types
        working-directory: src-tauri

      - name: Verify Bindings are up-to-date
        run: |
          if [ -n "$(git status --porcelain src/lib/bindings.ts)" ]; then
            echo "::error::TypeScript bindings are out of sync! Please run 'bun run specta:generate' locally and commit the changes."
            git diff src/lib/bindings.ts
            exit 1
          fi

      - name: 🦀 Run rustfmt
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: 🦀 Run Clippy
        run: cargo clippy --all-targets --all-features --keep-going
        working-directory: src-tauri

      - name: 🦀 Run cargo tests
        run: cargo test --workspace --no-fail-fast
        working-directory: src-tauri
